<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box</title>
    <style>
        *{
            box-sizing: border-box;
            margin:0;
            padding:0;
           background: radial-gradient(left,black);
        }
        body{
            height: 100vh;
            width: 65vw;
            text-align: center;
            background: radial-gradient(left,black);
            background-image: radial-gradient(black,blue,black);
        }
        #box1{
            height: 50%;
            width: 20%;
            background-color: black;
             margin-left: 50%;
             margin-top: 25%;
             padding-top: 30px;
             border-radius: 20px;
        }
        #stop{
            height: 28%;
            width:120px;
            color: white;
            background-color: red;
            padding: 30px 10px 20px 10px;
            border-radius: 50%;
            margin-left: 20%;
            margin-bottom: 10%;
            border: 3px solid white;
        }
         #get_Ready{
            height: 28%;
            width:120px;
            color: white;
            background-color: orange;
            padding: 30px 10px 20px 10px;
            border-radius: 50%;
            margin-left: 20%;
            margin-bottom: 10%;
             border: 3px solid white;
        }
         #Start{
           height: 28%;
            width:120px;
            color: white;
            background-color: green;
            padding: 20px 10px 40px 10px;
            border-radius: 50%;
            margin-left: 20%;
            margin-bottom: 20%;
             border: 3px solid white;
        }
         #box2{
            margin-left: 60%;
            height: 25%;
            width: 1%;
            background-color: black;
        }
        #heading{
            font-size: 40px;
            margin-top: 5%;
            margin-left: 20%;
        }
        #para{
            font-size: 20px;
            margin-top: 2%;
            margin-left: 20%;
        }
    </style>
</head>
<body >
    
    <div id="box1">
        <p id="stop">Stop <br>Procrastination🤚</p>
        <p id="get_Ready">Get Ready To <br>Learn<br>📅</p>
        <p id="Start">Start Your Tech<br>Journey<br>💻</p>
    </div>
    <div id="box2"></div>
    <h1 id="heading">Full Stack Experts Academy</h1>
    <p id="para">💡Learn-Built-Grow💡</p>
</body>
</html>
