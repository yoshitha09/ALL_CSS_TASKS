<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
             display: flex;
          justify-content: center;
          align-items: center;
        }
        .container{
            height: 550px;
            width: 550px;
            background-color: blueviolet;
            border-radius: 50%;
             display: flex;
          justify-content: center;
          align-items: center;
          border: 5px solid rgb(87, 70, 27);
        }
        .box1{
            height: 420px;
            width: 420px;
            background-color: rgb(109, 13, 165);
            border-radius: 50%;
             display: flex;
          justify-content: center;
          align-items: center;
            border: 5px solid goldenrod;
        }
        .box2{
            height: 310px;
            width: 310px;
            background-color: rgb(101, 49, 234);
            border-radius: 50%;
            display: flex;
          justify-content: center;
          align-items: center;
            border: 5px solid rgb(78, 61, 20);
        }
        .box3{
            height: 200px;
            width: 200px;
            background-color: rgb(170, 110, 213);
            border-radius: 50%;
              border: 5px solid goldenrod;
            display: flex;
          justify-content: center;
          align-items: center;
        }
        h2{
            color: rgb(58, 49, 27);
            font-size: 25px;
            text-shadow: 10px 10px 5px rgb(89, 73, 39);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            <div class="box2">
                <div class="box3"><h2> JAVA FULL STACK</h2></div>
            </div>
        </div>
    </div>
</body>
</html>
