<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <style>
        .container{
            height: 500px;
            width: 900px;
            border: 5px solid yellow;
            display:flex;
            flex-direction: row;
            align-items: center;
           
        }
        .box{
             height: 50px;
            width: 500px; 
            border: 2px solid black;   
                  
           
        }
        .box1{
            background-color: red;
            flex-grow: 0;
           flex-shrink: 5;
        }
        .box2{
            background-color: green;
           flex-grow: 0;
           flex-shrink: 1;
         
        }
        .box3{
            background-color: blue;
            flex-grow: 0;
           flex-shrink: 10;
            
        }
       
    </style>
</head>
<body>
    <div class="container">
    <div class="box box1">hero1</div>
    <div class="box box2">hero2</div>
    <div class="box box3">hero3</div>
   
    </div>
</body>
</html>
